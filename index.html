<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15213F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Full Body">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Carnet Full Body</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Carnet de salle mobile. Couleurs de catégories = code couleur des disques olympiques (rouge 25, bleu 20, jaune 15, vert 10). Carte héros bleu nuit, mode séance plein écran. */
:root{
  --bg:#EDEFEA; --surface:#FFFFFF; --surface-2:#F6F7F4; --sunk:#E2E5DF; --line:#D0D5CC;
  --ink:#14171A; --muted:#5A615B; --accent:#2350B8; --accent-ink:#FFFFFF; --accent-soft:#DDE5F8;
  --gold:#C99412; --gold-soft:#FBF0CF;
  --good:#1E7A44; --good-soft:#D9F0E1; --warn:#9A5A00; --warn-soft:#FAEBD4; --danger:#B3261E; --danger-soft:#F9DEDC;
  --hero:#15213F; --hero-ink:#F2F4F8; --hero-muted:#A9B4CF; --hero-line:#2C3A60;
  --c-legs:#2350B8; --c-push:#D2452F; --c-pull:#2E9D5B; --c-arms:#D9A21B;
  --figure:#14171A; --prop:#8A918B; --shadow:0 10px 30px rgba(20,23,26,.10);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1213; --surface:#181C1D; --surface-2:#1F2425; --sunk:#262B2C; --line:#31383A;
  --ink:#ECEFEC; --muted:#98A29C; --accent:#7FA3F5; --accent-ink:#0D1530; --accent-soft:#1E2A47;
  --gold:#F2C94C; --gold-soft:#3A2F10;
  --good:#6FCF97; --good-soft:#15301F; --warn:#F2B45C; --warn-soft:#36270F; --danger:#F28B82; --danger-soft:#3B1D1B;
  --hero:#1B2545; --hero-ink:#EEF1F8; --hero-muted:#9AA6C4; --hero-line:#2E3A62;
  --c-legs:#6E9BF0; --c-push:#EF7A63; --c-pull:#5CC48A; --c-arms:#F2C94C;
  --figure:#ECEFEC; --prop:#6F7873; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1213; --surface:#181C1D; --surface-2:#1F2425; --sunk:#262B2C; --line:#31383A;
  --ink:#ECEFEC; --muted:#98A29C; --accent:#7FA3F5; --accent-ink:#0D1530; --accent-soft:#1E2A47;
  --gold:#F2C94C; --gold-soft:#3A2F10;
  --good:#6FCF97; --good-soft:#15301F; --warn:#F2B45C; --warn-soft:#36270F; --danger:#F28B82; --danger-soft:#3B1D1B;
  --hero:#1B2545; --hero-ink:#EEF1F8; --hero-muted:#9AA6C4; --hero-line:#2E3A62;
  --c-legs:#6E9BF0; --c-push:#EF7A63; --c-pull:#5CC48A; --c-arms:#F2C94C;
  --figure:#ECEFEC; --prop:#6F7873; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.press{transition:transform .12s ease}
.press:active{transform:scale(.97)}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* header */
header.top{padding-block:18px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;flex:0 0 40px}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:.9;text-transform:uppercase}
.brand h1 span{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;letter-spacing:.1em;color:var(--muted);margin-top:4px}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
section.view{display:flex;flex-direction:column;gap:16px}
.view.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:.35;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}
.wd b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line);font-family:var(--f-display);font-size:17px;color:var(--muted)}
.wd.today b{border:2px solid var(--accent);color:var(--accent)}
.wd.done b{border:0;color:#fff;background:var(--cat,var(--accent));animation:popin .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--j)*60ms)}
@keyframes popin{from{transform:scale(.4)}to{transform:none}}
.wcount{font-family:var(--f-display);font-weight:800;font-size:22px}
.wcount small{font-size:14px;color:var(--muted)}
/* day selector */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.day{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;overflow:hidden;transition:border-color .2s,background .2s,transform .12s}
.day:active{transform:scale(.97)}
.day b{font-family:var(--f-display);font-size:30px;font-weight:900;line-height:1}
.day span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .tag{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:999px}
.day .mini{height:3px;background:var(--sunk);border-radius:2px;margin-top:4px;overflow:hidden}
.day .mini i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .5s}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.hero .plates{position:absolute;right:-60px;top:-60px;width:230px;height:230px;opacity:.9;pointer-events:none}
.hero .plates circle{fill:none;stroke:var(--hero-line)}
.hero .plates .spin{transform-origin:115px 115px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-top{display:flex;gap:16px;align-items:center;position:relative}
.ring{flex:0 0 88px;width:88px;height:88px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--hero-line)}
.ring .fg{stroke:var(--hero-ink);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .ctr b{font-family:var(--f-display);font-size:40px;font-weight:900;line-height:.8}
.hero h2{font-family:var(--f-display);font-weight:900;font-size:34px;text-transform:uppercase;line-height:.92}
.hero p{margin:4px 0 0;color:var(--hero-muted);font-size:13px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.hstats div{border-top:1px solid var(--hero-line);padding-top:8px}
.hstats b{display:block;font:600 19px var(--f-mono)}
.hstats span{font-size:11px;color:var(--hero-muted)}
.hbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--hero-ink);color:var(--hero);border-radius:14px;padding:15px;font-weight:800;font-size:16px;transition:transform .12s}
.hbtn:active{transform:scale(.98)}
.hbtn svg{width:20px;height:20px}
.hlinks{display:flex;justify-content:space-between;gap:10px;position:relative;font-size:12.5px;color:var(--hero-muted)}
.hlinks button{color:var(--hero-muted);text-decoration:underline;text-underline-offset:3px}
.hlinks button.confirm{color:#FF9B8F}
/* exercise list */
.xlist{display:flex;flex-direction:column;gap:8px}
.xrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 12px 8px 8px;min-width:0}
.xfig{flex:0 0 74px;height:62px;border-radius:11px;background:var(--sunk);background:color-mix(in srgb,var(--cat) 13%,var(--surface));display:block}
.xfig svg{width:100%;height:100%;display:block}
.xmain{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.xmain strong{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xmeta{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:4px}
.dots i{width:18px;height:5px;border-radius:3px;background:var(--sunk);transition:background .3s}
.dots i.on{background:var(--good)}
.xside{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chev{width:18px;height:18px;stroke:var(--muted)}
.ssgrp{position:relative;display:flex;flex-direction:column;gap:8px;padding-left:14px}
.ssgrp::before{content:"";position:absolute;left:3px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent);opacity:.5}
.sslbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.up{background:var(--good-soft);color:var(--good)}
.chip.hold{background:var(--warn-soft);color:var(--warn)}
.chip.new{background:var(--sunk);color:var(--muted)}
.chip.pr{background:var(--gold-soft);color:var(--gold)}
.chip.reset{background:var(--danger-soft);color:var(--danger)}
.wu{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.wu.ok{background:var(--good-soft);border-color:transparent}
.wu.ok .wur{display:none}
.wuh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px 4px}
.wur{display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:10px;text-align:left;transition:background .15s}
.wur:active{background:var(--sunk)}
.wur i{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 12px var(--f-mono);font-style:normal;transition:background .2s}
.wur.done i{background:var(--good);border-color:var(--good);color:var(--surface);animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
.wur span{flex:1;font-size:14px;min-width:0}
.wur b{font-size:14px}
.wur.done span,.wur.done b{color:var(--muted);text-decoration:line-through}
.alts{display:flex;flex-direction:column;gap:10px}
.alt{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px 12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:8px}
.alt.back{border-style:dashed}
.alt .afig{height:72px;border-radius:11px;background:var(--sunk);background:color-mix(in srgb,var(--cat) 13%,var(--surface))}
.alt .afig svg{width:100%;height:100%;display:block}
.alt .ainfo{min-width:0;display:flex;flex-direction:column;gap:2px}
.alt .ainfo strong{font-size:15px;line-height:1.2}
.alt .ainfo span{font-size:12px;color:var(--muted)}
.alt .abtns{grid-column:1/-1;display:flex;gap:8px}
.alt .abtns .btn{padding:11px 10px;font-size:14px}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;padding:10px 12px}
.tip svg{flex:0 0 18px;width:18px;height:18px;stroke:var(--accent);margin-top:1px}
/* figures */
.fig-line{stroke:var(--figure);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig-back{stroke:var(--figure);opacity:.35;stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig-head{fill:var(--figure)}
.fig-prop{fill:var(--prop);opacity:.7}
.fig-propl{stroke:var(--prop);stroke-width:3;stroke-linecap:round;fill:none;opacity:.8}
.fig-floor{stroke:var(--prop);stroke-width:2;opacity:.35}
.fig-w{fill:var(--cat,var(--accent))}
.fig-cable{stroke:var(--prop);stroke-width:1.5;stroke-dasharray:3 3}
.fig-shadow{fill:var(--figure);opacity:.08}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px;box-shadow:var(--shadow)}
nav.tabs button{border-radius:15px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);transition:background .25s,color .25s}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent-ink);background:var(--accent)}
/* library */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex:0 0 auto;border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;background:var(--surface);transition:background .2s,border-color .2s}
.filters button i{width:9px;height:9px;border-radius:50%;background:var(--cat)}
.filters button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.libgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lib{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;transition:transform .12s}
.lib:active{transform:scale(.97)}
.lib .fig{border-radius:11px;aspect-ratio:200/150;max-width:100%;background:var(--sunk);background:color-mix(in srgb,var(--cat) 13%,var(--surface))}
.lib .fig svg{width:100%;height:100%;display:block}
.lib strong{font-size:14px;padding:0 4px;line-height:1.2}
.lib .sub{font-size:11.5px;color:var(--muted);padding:0 4px;display:flex;align-items:center;gap:6px}
.lib .sub i{width:8px;height:8px;border-radius:50%;background:var(--cat);flex:0 0 8px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:6px;font-family:var(--f-display);font-weight:800;font-size:14px;background:var(--ink);color:var(--bg);padding:0 5px}
/* overlays */
.overlay{position:fixed;inset:0;z-index:50}
#sheet{z-index:80;background:rgba(8,10,12,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
#sheet .panel{background:var(--surface);width:100%;max-width:600px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:slideup .4s cubic-bezier(.2,.9,.2,1) both}
@keyframes slideup{from{transform:translateY(60%)}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-head h2{font-family:var(--f-display);font-weight:900;font-size:32px;text-transform:uppercase;line-height:.95}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.stage{border-radius:18px;padding:8px;background:var(--sunk);background:color-mix(in srgb,var(--cat) 14%,var(--surface));position:relative}
.stage svg{width:100%;height:auto;display:block;max-height:300px}
.stage .cap{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--muted);padding:0 6px 2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips span{border:1.5px solid var(--cat);color:var(--ink);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.mchips span:first-child{background:var(--cat);color:#fff;border-color:var(--cat)}
.target{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.target div{padding:10px 12px;display:flex;flex-direction:column}
.target div+div{border-left:1px solid var(--line)}
.target b{font:600 19px var(--f-mono)}
.sh-sec{display:flex;flex-direction:column;gap:8px}
.sh-sec p{margin:0;max-width:65ch}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 13px var(--f-mono)}
.errs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.errs li{display:flex;gap:10px;align-items:flex-start}
.errs li svg{flex:0 0 20px;width:20px;height:20px;stroke:var(--danger);fill:none;stroke-width:2.4;stroke-linecap:round;margin-top:1px}
.callout{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14px}
/* focus mode */
#focus{background:var(--bg);overflow-y:auto;animation:slideup .45s cubic-bezier(.2,.9,.2,1) both;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.fwrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.fbar{display:flex;align-items:center;gap:10px}
.fbar .ttl{flex:1;min-width:0}
.fbar .ttl b{font-family:var(--f-display);font-weight:900;font-size:20px;text-transform:uppercase;display:block;line-height:1}
.fbar .ttl span{font:600 13px var(--f-mono);color:var(--muted)}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;position:relative}

function svgFig(id,opts={}){
  const ex=EX[id], on=!reduced && opts.anim!==false, P=opts.still===1&&!on?ex.b:ex.a, Q=opts.still===1&&!on?ex.a:ex.b;

const fmt=n=>(Math.round(n*100)/100).toLocaleString("fr-FR");
const sortS=list=>list.slice().sort((a,b)=>a.date<b.date?-1:1);
const fmtDate=iso=>new Date(iso).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const dkey=d=>{const x=new Date(d);return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate();};
const mondayOf=d=>{const m=new Date(d);m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7));return m;};
const restTxt=s=>s>=120?(s/60)+" min":s+" s";
const est1rm=(kg,r)=>r>0?kg*(1+r/30):0;
function nextDay(){ const s=sortS(sessions); return s.length?({A:"B",B:"C",C:"A"}[s[s.length-1].day]||"A"):"A"; }
function lastFor(id,list=sessions){ const s=sortS(list).filter(x=>x.sets&&x.sets[id]&&x.sets[id].length); return s.length?{date:s[s.length-1].date,sets:s[s.length-1].sets[id]}:null; }
function advice(id){
  const last=lastFor(id), T=TARGET[id], E=EX[id];
  if(!last) return {kind:"new",short:"Nouveau",text:"Première fois : trouve une charge où tu fais "+T.min+" reps propres."};
  const top=Math.max(...last.sets.map(x=>+x.kg||0));
  const full=last.sets.length>=3&&last.sets.every(x=>(+x.reps||0)>=T.max);
  if(full){ const kg=Math.round((top+E.inc)*100)/100; return {kind:"up",short:"↑ "+fmt(kg)+" kg",text:"Objectif atteint la dernière fois : passe à "+fmt(kg)+" kg.",kg}; }
  // stagnation : même charge max sur les 3 dernières séances, sans gagner de répétitions
  const hist=sortS(sessions).filter(x=>x.sets&&x.sets[id]).map(x=>x.sets[id]).slice(-3);
  if(hist.length===3){
    const tops=hist.map(a=>Math.max(...a.map(x=>+x.kg||0))), sums=hist.map(a=>a.reduce((n,x)=>n+(+x.reps||0),0));
    if(tops.every(t=>t===tops[0]) && sums[2]<=sums[0]){
      if(top<=0) return {kind:"reset",short:"Bloqué",text:"Pas de progrès depuis 3 séances. Ajoute 2 répétitions négatives lentes (5 s de descente) en fin de série, ou passe une semaine au tirage vertical.",kg:0};
      const kg=Math.max(0,Math.floor(top*0.9/E.inc)*E.inc);
      return {kind:"reset",short:"↓ "+fmt(kg)+" kg",text:"Bloqué à "+fmt(top)+" kg depuis 3 séances. Redescends à "+fmt(kg)+" kg (−10 %) et vise "+T.max+" reps, puis remonte de "+fmt(E.inc)+" kg à chaque fois que tu y arrives. Tu repasseras ton ancien record en quelques séances.",kg};
    }
  }
  return {kind:"hold",short:"= "+fmt(top)+" kg",text:"Garde "+fmt(top)+" kg et vise une répétition de plus.",kg:top};
}
/* ordre des séries dans une séance (supersets alternés) */
function seq(d){ const it=items(d),out=[]; for(let k=0;k<it.length;k++){ if(it[k][4]&&it[k+1]&&it[k+1][4]){ for(let s=0;s<3;s++){out.push([it[k][0],s]);out.push([it[k+1][0],s]);} k++; } else for(let s=0;s<3;s++) out.push([it[k][0],s]); } return out; }
/* brouillons */
let drafts=LS.get("fb-drafts",{}), day=nextDay();
buildTargets();
function draft(d){
  if(!drafts[d]) drafts[d]={sets:{},startedAt:null,swaps:{}};
  for(const it of items(d)) if(!drafts[d].sets[it[0]]) drafts[d].sets[it[0]]=[0,1,2].map(()=>({kg:"",reps:"",done:false}));
  return drafts[d];
}
const saveDrafts=()=>LS.set("fb-drafts",drafts);
const doneIn=d=>{ const dr=draft(d); return items(d).reduce((a,it)=>a+dr.sets[it[0]].filter(s=>s.done).length,0); };
const hasAnyDraft=()=>["A","B","C"].some(d=>drafts[d]&&Object.values(drafts[d].sets||{}).flat().some(s=>s.done));
function suggest(d,id,i){
  const ds=draft(d).sets[id], T=TARGET[id];
  for(let k=i-1;k>=0;k--) if(ds[k].done) return {kg:+ds[k].kg,reps:+ds[k].reps};
  const last=lastFor(id), adv=advice(id);
  if(last){ const ls=last.sets[i]||last.sets[last.sets.length-1]; if(adv.kind==="up") return {kg:adv.kg,reps:T.min}; if(adv.kind==="reset") return {kg:adv.kg,reps:T.max}; return {kg:+ls.kg,reps:Math.min(T.max,+ls.reps||T.min)}; }
  return {kg:EX[id].def,reps:T.min};
}

/* échauffement : séries d'approche calculées depuis la charge de la série 1 */
const needsWU=id=>{ const T=TARGET[id]; return !!T&&(T.idx===0||!!EX[id].wu); };
function warmup(id,kg){
  const E=EX[id], r=v=>Math.round(v/E.inc)*E.inc; if(!(kg>0)) return [];
  if(kg<10){ const w=r(kg*.6); return [{kg:0,reps:8,l:"Sans charge"}].concat(w>0&&w<kg?[{kg:w,reps:5}]:[]); }
  const out=[]; if(E.bar&&kg>=40) out.push({kg:20,reps:10,l:"Barre à vide"});
  [[.5,8],[.7,5],[.85,3]].forEach(([p,n])=>{ const w=r(kg*p), prev=out.length?out[out.length-1].kg:-1; if(w>prev&&w<kg) out.push({kg:w,reps:n}); });
  return out;
}
function wuHTML(){
  const id=focus.ex, dr=draft(focus.d), ds=dr.sets[id];
  if(focus.i!==0||ds[0].done||!needsWU(id)) return "";
  const list=warmup(id,focus.kg); if(!list.length) return "";
  const st=(dr.wu&&dr.wu[id])||[], all=list.every((_,k)=>st[k]);
  return `<div class="wu ${all?'ok':''}"><div class="wuh"><span class="label">${all?"Échauffement fait ✓":"Échauffement · avant la série 1"}</span><span class="note">${all?"":"Non enregistré"}</span></div>
    ${list.map((w,k)=>`<button class="wur ${st[k]?'done':''}" data-wu="${k}"><i>${st[k]?"✓":k+1}</i><span>${w.l||"Approche "+(k+1)}</span><b class="num">${w.kg?fmt(w.kg)+" kg":"—"} × ${w.reps}</b></button>`).join("")}</div>`;
}
function refreshWU(){ const b=document.getElementById("wuBox"); if(b) b.innerHTML=wuHTML(); }
function toggleWU(k){
  ensureAudio();
  const id=focus.ex, dr=draft(focus.d); dr.wu=dr.wu||{}; const st=dr.wu[id]=(dr.wu[id]||[]).slice();
  st[k]=!st[k]; saveDrafts(); refreshWU();
  if(!st[k]) return;
  const list=warmup(id,focus.kg), nxt=list.findIndex((_,j)=>!st[j]);
  if(nxt>=0) startRest(60,"Approche "+(nxt+1)+" · "+(list[nxt].kg?fmt(list[nxt].kg)+" kg":"sans charge")+" × "+list[nxt].reps);
  else startRest(90,EX[id].name+" · série 1 · "+fmt(focus.kg)+" kg × "+focus.reps);
}

/* remplacement d'exercice */

  const done=draft(d).sets[id].filter(s=>s.done).length;

    <div class="grab"></div>

    <div class="alts">${opts.length?opts.map(o=>{ const E=EX[o.id], bs=DAYS[d].items.find(x=>x[0]===slot), rr=E.rr||[bs[1],bs[2]];

        <div class="abtns"><button class="btn" data-swap="${o.id}" data-slot="${slot}" data-d="${d}" data-scope="today">Aujourd'hui</button><button class="btn primary" data-swap="${o.id}" data-slot="${slot}" data-d="${d}" data-scope="always">Toujours</button></div></div>`; }).join("")
      :`<div class="empty">Pas d'autre variante disponible pour cet exercice.</div>`}</div>

function applySwap(slot,newId,scope,d){

function bump(el){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
fEl.addEventListener("input",e=>{
  if(e.target.id==="fKg"){ const v=parseFloat(e.target.value.replace(",",".")); if(!isNaN(v)){ focus.kg=Math.max(0,v); refreshWU(); } }
  if(e.target.id==="fReps"){ const v=parseInt(e.target.value,10); if(!isNaN(v)) focus.reps=Math.max(0,v); }
});
fEl.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;

    else { focus.reps=Math.max(0,focus.reps+dir); const i=document.getElementById("fReps"); i.value=focus.reps; bump(i); }
    return;
  }

  if(b.id==="fPrev"||b.id==="fNext"){

function validateSet(){
  ensureAudio();
  if(!(focus.reps>0)){ toast("Indique au moins une répétition."); return; }
  const d=focus.d, id=focus.ex, i=focus.i, s=draft(d).sets[id][i], wasDone=s.done;
  s.kg=focus.kg; s.reps=focus.reps; s.done=true; saveDrafts();
  try{ navigator.vibrate&&navigator.vibrate(30); }catch(e){}
  if(wasDone){ toast("Série corrigée."); const f=firstUndone(d); if(f) setCursor(f[0],f[1]); else focus.ex=null; renderFocus(); return; }
  // étape suivante dans l'ordre de la séance
  const sq=seq(d), pos=sq.findIndex(x=>x[0]===id&&x[1]===i);
  let nxt=null; for(let k=1;k<=sq.length;k++){ const c=sq[(pos+k)%sq.length]; if(!draft(d).sets[c[0]][c[1]].done){ nxt=c; break; } }
  const T=TARGET[id];
  focus.banner=null;
  if(!nxt){ focus.ex=null; renderFocus(); fEl.scrollTo({top:0,behavior:"smooth"}); return; }
  const chained = T.ss && T.ss.first && nxt[0]===T.ss.other && nxt[1]===i;
  setCursor(nxt[0],nxt[1]);
  if(chained){ focus.banner="Enchaîne sans repos : "+EX[nxt[0]].name; renderFocus(); fEl.scrollTo({top:0,behavior:"smooth"}); }
  else { renderFocus(nxt[0]===id?i:undefined); startRest(T.rest, EX[nxt[0]].name+" · série "+(nxt[1]+1)+" · "+fmt(focus.kg)+" kg × "+focus.reps); fEl.scrollTo({top:0}); }
}

/* minuteur de repos */
const rEl=document.getElementById("rest"), pill=document.getElementById("restpill");
let rest=null, restInt=null;
function startRest(sec,nextTxt){
  rest={end:Date.now()+sec*1000,total:sec,next:nextTxt,ended:false};
  rEl.innerHTML=`<span class="label" style="color:var(--hero-muted)">Récupération</span>
    <div class="rring" id="rRing">${ring(1,240,12)}<div class="ctr"><b id="rT">0:00</b><span>Repos</span></div></div>

  clearInterval(restInt); restInt=setInterval(restTick,200); restTick();
}
function restTick(){
  if(!rest) return;
  const left=Math.max(0,(rest.end-Date.now())/1000), sec=Math.ceil(left), txt=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
  const t=document.getElementById("rT"); if(t) t.textContent=txt;
  const fg=rEl.querySelector(".fg"); if(fg){ const C=+fg.getAttribute("stroke-dasharray"); fg.setAttribute("stroke-dashoffset",C*(1-left/rest.total)); }
  if(sec<=3&&sec>0&&rest.lastBeep!==sec){ rest.lastBeep=sec; beep(660,.08); }
  updRestPill(txt,left);
  if(left<=0&&!rest.ended){ rest.ended=true; beep(990,.25); try{navigator.vibrate&&navigator.vibrate([200,80,200])}catch(e){}
    const r=document.getElementById("rRing"); if(r) r.classList.add("end"); const lb=rEl.querySelector(".ctr span"); if(lb) lb.textContent="C'est reparti";
    setTimeout(endRest,1300); }
}
function endRest(){ clearInterval(restInt); rest=null; rEl.hidden=true; updRestPill(); }
rEl.addEventListener("click",e=>{ const b=e.target.closest("[data-r]"); if(!b||!rest) return;
  if(b.dataset.r==="skip") return endRest();
  rest.end+= (+b.dataset.r)*1000; if(+b.dataset.r>0) rest.total+= +b.dataset.r; if(rest.end<Date.now()+1000) rest.end=Date.now()+1000; restTick(); });
function updRestPill(txt,left){
  if(!rest||focus.open){ pill.hidden=true; return; }
  pill.hidden=false; const C=2*Math.PI*12;
  pill.innerHTML=`<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="var(--hero-line)" stroke-width="4"/><circle cx="15" cy="15" r="12" fill="none" stroke="var(--hero-ink)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-(left??0)/rest.total)}"/></svg><b>${txt||""}</b>Repos`;
}
pill.addEventListener("click",()=>{ day=focus.d||day; openFocus(); if(rest) rEl.hidden=false; });
function ensureAudio(){ try{ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==="suspended") audio.resume(); }catch(e){} }

/* =========================================================
   7. FIN DE SÉANCE : bilan, records, confettis
   ========================================================= */
const sumEl=document.getElementById("summary");
async function finishSession(d){
  const dr=draft(d), out={};
  for(const [ex,arr] of Object.entries(dr.sets)){ const done=arr.filter(s=>s.done).map(s=>({kg:+s.kg||0,reps:+s.reps||0})); if(done.length) out[ex]=done; }
  if(!Object.keys(out).length){ toast("Valide au moins une série avant de terminer."); return; }
  const prs=[];
  for(const [ex,arr] of Object.entries(out)){
    const prev=sessions.filter(s=>s.sets&&s.sets[ex]).flatMap(s=>s.sets[ex]); if(!prev.length) continue;
    const pKg=Math.max(...prev.map(x=>x.kg)), pRm=Math.max(...prev.map(x=>est1rm(x.kg,x.reps)));
    const nKg=Math.max(...arr.map(x=>x.kg)), nRm=Math.max(...arr.map(x=>est1rm(x.kg,x.reps)));
    if(nKg>pKg) prs.push({ex,txt:"Charge max : "+fmt(nKg)+" kg (avant "+fmt(pKg)+")"});
    else if(nRm>pRm+.01) prs.push({ex,txt:"1RM estimé : "+fmt(Math.round(nRm*2)/2)+" kg (avant "+fmt(Math.round(pRm*2)/2)+")"});
  }
  const dur=dr.startedAt?Math.max(1,Math.round((Date.now()-dr.startedAt)/60000)):null;
  const s={id:"s"+Date.now().toString(36),date:new Date().toISOString(),day:d,sets:out,minutes:dur};
  await persist(s);
  delete drafts[d]; saveDrafts(); endRest();
  if(focus.open){ focus.open=false; fEl.hidden=true; fEl.innerHTML=""; clearInterval(chronoInt); try{wake&&wake.release()}catch(e){} }
  day=nextDay(); showSummary(s,prs);
}
function showSummary(s,prs){
  const nSets=Object.values(s.sets).flat().length, ton=Object.values(s.sets).flat().reduce((a,x)=>a+x.kg*x.reps,0);
  sumEl.innerHTML=`<canvas id="confetti"></canvas><div class="fwrap">
    <div class="sumhead"><svg class="medal" viewBox="0 0 96 96"><path d="M30 6h14l8 22H38zM66 6H52l-8 22h14z" fill="${DAYCOL[s.day]}"/><circle cx="48" cy="58" r="32" fill="var(--gold)"/><circle cx="48" cy="58" r="23" fill="none" stroke="var(--gold-soft)" stroke-width="3"/><text x="48" y="70" text-anchor="middle" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="900" font-size="34" fill="var(--gold-soft)">${s.day}</text></svg>

      :`<p class="note">Pas de record cette fois. La régularité fait le travail : trois séances par semaine, et les charges suivront.</p>`}
    <div class="card"><span class="label">Prochaine séance</span><div style="display:flex;align-items:center;gap:12px"><div class="hrow" style="border:0;padding:0"><span class="d" style="--cat:${DAYCOL[nextDay()]}">${nextDay()}</span></div><div><strong>${focusTxt(nextDay())}</strong><div class="note">Laisse au moins un jour de repos avant.</div></div></div></div>

  </div>`;
  sumEl.hidden=false; document.body.style.overflow="hidden";

}
sumEl.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  if(b.id==="sumClose"||b.id==="sumProg"){ sumEl.hidden=true; sumEl.innerHTML=""; document.body.style.overflow=""; renderAll(false); if(b.id==="sumProg"){ progEx=ORDER.find(x=>lastFor(x))||"legpress"; showTab("prog"); } else showTab("seance"); } });
function countUps(root){
  root.querySelectorAll("[data-count]").forEach(el=>{
    const to=+el.dataset.count, suf=el.dataset.suf||"", fm=v=>fmt(Math.round(v))+suf;
    if(reduced||!to){ el.textContent=fm(to); return; }
    const t0=performance.now(), D=900; const f=now=>{ const p=Math.min(1,(now-t0)/D), e=1-Math.pow(1-p,3); el.textContent=fm(to*e); if(p<1) requestAnimationFrame(f); }; requestAnimationFrame(f);
  });
}
function confetti(cv){
  const ctx=cv.getContext("2d"), dpr=devicePixelRatio||1; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; ctx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement), cols=["--c-legs","--c-push","--c-pull","--c-arms","--gold"].map(v=>cs.getPropertyValue(v).trim());
  const P=[...Array(140)].map(()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.28,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0],round:Math.random()<.4}));
  const t0=performance.now();
  const f=now=>{ const t=now-t0; ctx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of P){ p.vy+=.32; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.globalAlpha=Math.max(0,1-t/3200); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c;
      if(p.round){ ctx.beginPath(); ctx.arc(0,0,p.r/2,0,7); ctx.fill(); } else ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }
    if(t<3200&&cv.isConnected) requestAnimationFrame(f); else ctx.clearRect(0,0,innerWidth,innerHeight); };
  requestAnimationFrame(f);
}

sheet.addEventListener("click",e=>{

const vP=document.getElementById("v-prog"); let progEx="legpress", demo=false;
function demoData(){
  const base={legpress:80,squat:50,bench:40,row:16,lateral:6,curl:10,rdl:50,ohp:12,pullup:0,rearfly:5,triceps:20,bulgarian:8,incline:14,cablerow:40,legcurl:25,calf:0};
  const out=[], start=mondayOf(new Date()); start.setDate(start.getDate()-7*5);
  const cnt={}; let n=0;
  for(let w=0;w<6;w++) for(const [k,off] of [["A",0],["B",2],["C",4]]){
    if(w===5&&off>2) continue; if(w===2&&k==="C") continue;
    const dt=new Date(start); dt.setDate(start.getDate()+w*7+off); dt.setHours(18,30); if(dt>new Date()) continue;
    const sets={}; for(const it of items(k)){ const id=it[0]; cnt[id]=(cnt[id]||0)+1; const kg=(base[id]??EX[id].def)+Math.floor((cnt[id]-1)/2)*EX[id].inc; const r=it[1]+((cnt[id]-1)%2)*(it[2]-it[1]); sets[id]=[0,1,2].map(j=>({kg,reps:Math.max(it[1],r-(j===2?1:0))})); }
    out.push({id:"demo"+(n++),date:dt.toISOString(),day:k,sets,minutes:42+(n%6)});
  }
  return out;
}
function spark(vals,w=120,h=30){
  if(vals.length<2) return `<svg viewBox="0 0 ${w} ${h}"><line x1="0" x2="${w}" y1="${h/2}" y2="${h/2}" stroke="var(--line)" stroke-dasharray="3 4"/></svg>`;
  const lo=Math.min(...vals),hi=Math.max(...vals),r=hi-lo||1, X=i=>3+i*(w-6)/(vals.length-1), Y=v=>h-4-(v-lo)/r*(h-8);
  const pts=vals.map((v,i)=>X(i)+","+Y(v)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path class="draw" pathLength="1" d="M${pts.split(' ').join(' L')}" fill="none" stroke="var(--cat)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function bigChart(points){
  const W=330,H=180,pl=34,pr=14,pt=22,pb=26, ys=points.map(p=>p.y);
  let lo=Math.min(...ys),hi=Math.max(...ys); if(hi===lo){lo=Math.max(0,lo-5);hi+=5;} const pad=(hi-lo)*.18; lo=Math.max(0,lo-pad); hi+=pad;
  const n=points.length, X=i=>n===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(n-1), Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  let g=""; for(let k=0;k<=3;k++){ const v=lo+(hi-lo)*k/3; g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="${k?'2 4':''}"/><text x="${pl-6}" y="${Y(v)+3}" text-anchor="end">${fmt(Math.round(v))}</text>`; }
  const line=points.map((p,i)=>`${X(i)},${Y(p.y)}`).join(" "), area=`${X(0)},${H-pb} ${line} ${X(n-1)},${H-pb}`;
  const step=Math.max(1,Math.ceil(n/5)); let xl=""; points.forEach((p,i)=>{ if(i%step===0||i===n-1) xl+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${new Date(p.d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})}</text>`; });
  const lp=points[n-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la charge max">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--cat)" stop-opacity=".28"/><stop offset="1" stop-color="var(--cat)" stop-opacity="0"/></linearGradient></defs>
    ${g}<polygon class="fadein" points="${area}" fill="url(#ga)"/>
    <path class="draw" pathLength="1" d="M${line.split(' ').join(' L')}" fill="none" stroke="var(--cat)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p,i)=>`<circle class="fadein" cx="${X(i)}" cy="${Y(p.y)}" r="${i===n-1?5.5:3}" fill="${i===n-1?'var(--cat)':'var(--surface)'}" stroke="var(--cat)" stroke-width="2"/>`).join("")}
    <g class="fadein"><rect x="${Math.min(X(n-1),W-pr)-62}" y="${Y(lp.y)-28}" width="58" height="20" rx="6" fill="var(--ink)"/><text x="${Math.min(X(n-1),W-pr)-33}" y="${Y(lp.y)-14}" text-anchor="middle" style="fill:var(--bg);font-weight:600;font-size:11px">${fmt(lp.y)} kg</text></g>
    ${xl}</svg>`;
}
function renderProg(){
  const data=demo?demoData():sessions, s=sortS(data);
  if(!s.length){
    vP.innerHTML=`<div style="--i:0"><h2 class="disp" style="font-size:30px">Progrès</h2></div>
     <div class="card" style="--i:1"><div class="empty"><svg viewBox="0 0 150 110"><path d="M12 96h126" stroke="var(--line)" stroke-width="2"/>${[18,30,26,44,40,62,58,80].map((h,i)=>`<rect class="grow" style="--j:${i}" x="${18+i*15}" y="${96-h}" width="10" height="${h}" rx="3" fill="${['var(--c-legs)','var(--c-pull)','var(--c-push)'][i%3]}" opacity=".85"/>`).join("")}</svg>
      <strong>Aucune séance enregistrée</strong><span>Lance une séance depuis l'onglet Séance et valide tes séries. Ta régularité, ton tonnage et tes records apparaîtront ici.</span>
      <button class="btn small" id="demoOn">Voir un aperçu avec des données d'exemple</button></div></div>`;
    return;
  }
  const now=new Date(), mon=mondayOf(now), thisWeek=s.filter(x=>new Date(x.date)>=mon).length;
  const allSets=x=>Object.values(x.sets||{}).flat();
  // records battus (toutes séances)
  const bestSoFar={}; let prCount=0;
  s.forEach(x=>{ for(const [ex,arr] of Object.entries(x.sets||{})){ const m=Math.max(...arr.map(y=>y.kg)); if(bestSoFar[ex]!==undefined&&m>bestSoFar[ex]) prCount++; bestSoFar[ex]=Math.max(bestSoFar[ex]??-1,m); } });
  // semaines complètes d'affilée
  const wk=w=>{ const a=new Date(mon); a.setDate(a.getDate()-7*w); const b=new Date(a); b.setDate(b.getDate()+7); return s.filter(x=>{const t=new Date(x.date);return t>=a&&t<b;}); };
  let streak=0; for(let w=(thisWeek>=3?0:1);w<52;w++){ if(wk(w).length>=3) streak++; else break; }
  // heatmap 10 semaines
  const byDay={}; s.forEach(x=>byDay[dkey(x.date)]=x.day);
  let heat=`<span></span>`; const startH=new Date(mon); startH.setDate(startH.getDate()-63);
  const cells=[]; for(let r=0;r<7;r++){ cells.push(`<span class="dl">${"LMMJVSD"[r]}</span>`); for(let c=0;c<10;c++){ const dt=new Date(startH); dt.setDate(startH.getDate()+c*7+r); const k=dkey(dt), v=byDay[k], fut=dt>now;
    cells.push(`<span class="c ${v?'on':''} ${k===dkey(now)?'today':''}" style="--j:${c*7+r};--cat:${DAYCOL[v]||'transparent'};${fut?'opacity:.35':''}" title="${dt.toLocaleDateString('fr-FR')}">${v||""}</span>`); } }
  heat=cells.join("");
  // tonnage hebdo 8 semaines
  const tons=[...Array(8)].map((_,i)=>{ const w=7-i; return {w, t:wk(w).reduce((a,x)=>a+allSets(x).reduce((b,y)=>b+y.kg*y.reps,0),0)}; });
  const tMax=Math.max(1,...tons.map(x=>x.t)), BW=330,BH=130;
  const bars=tons.map((x,i)=>{ const h=Math.max(2,(x.t/tMax)*(BH-36)), bx=8+i*(BW-16)/8+6, bw=(BW-16)/8-12; const a=new Date(mon); a.setDate(a.getDate()-7*x.w);
    return `<rect class="grow" style="--j:${i}" x="${bx}" y="${BH-20-h}" width="${bw}" height="${h}" rx="5" fill="${x.w===0?'var(--accent)':'var(--sunk)'}"/>${x.t&&(x.w===0||x.t===tMax)?`<text x="${bx+bw/2}" y="${BH-26-h}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fmt(Math.round(x.t/100)/10)} t</text>`:""}<text x="${bx+bw/2}" y="${BH-6}" text-anchor="middle">${a.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})}</text>`; }).join("");
  const ton7=wk(0).reduce((a,x)=>a+allSets(x).reduce((b,y)=>b+y.kg*y.reps,0),0);
  // records par exercice
  const recs=orderAll().map(id=>{ const pts=s.filter(x=>x.sets&&x.sets[id]).map(x=>({d:x.date,y:Math.max(...x.sets[id].map(y=>y.kg)),sets:x.sets[id]})); return {id,pts}; }).filter(r=>r.pts.length);
  if(!recs.find(r=>r.id===progEx)) progEx=recs[0].id;
  const cur=recs.find(r=>r.id===progEx), pts=cur.pts, E=EX[progEx];
  const best=Math.max(...pts.map(p=>p.y)), rm=Math.max(...pts.flatMap(p=>p.sets.map(y=>est1rm(y.kg,y.reps)))), delta=pts[pts.length-1].y-pts[0].y;
  vP.innerHTML=`<div style="--i:0"><h2 class="disp" style="font-size:30px">Progrès</h2></div>
   ${demo?`<div class="demo" style="--i:0"><span>Aperçu avec des données d'exemple, pas les tiennes.</span><button class="btn small" id="demoOff">Quitter</button></div>`:""}
   <div class="kpis" style="--i:1">
     <div class="kpi hl"><b><i style="font-style:normal" data-count="${thisWeek}">0</i><i style="font-style:normal;font-size:16px;opacity:.7">/3</i></b><span>Séances cette semaine</span></div>
     <div class="kpi"><b data-count="${streak}" data-suf=" sem.">0</b><span>Semaines complètes d'affilée</span></div>
     <div class="kpi"><b data-count="${Math.round(ton7)}" data-suf=" kg">0</b><span>Tonnage cette semaine</span></div>
     <div class="kpi"><b data-count="${prCount}">0</b><span>Records battus · ${s.length} séances</span></div>
   </div>
   <div class="card" style="--i:2"><div class="card-h"><span class="label">Régularité · 10 semaines</span><div class="legend">${["A","B","C"].map(k=>`<span style="--cat:${DAYCOL[k]}"><i></i>${k}</span>`).join("")}</div></div><div class="heat">${heat}</div></div>
   <div class="card chart" style="--i:3"><span class="label">Tonnage par semaine</span><svg viewBox="0 0 ${BW} ${BH}" role="img" aria-label="Tonnage hebdomadaire">${bars}</svg><p class="note">Tonnage = charge × répétitions, additionné sur toutes les séries.</p></div>
   <div class="card" style="--i:4"><span class="label">Records par mouvement</span><div class="recs">${recs.map(r=>{ const b=Math.max(...r.pts.map(p=>p.y)), dl=r.pts[r.pts.length-1].y-r.pts[0].y;
      return `<button class="rec" aria-pressed="${r.id===progEx}" data-rec="${r.id}" style="--cat:${CAT[EX[r.id].cat].c}"><span class="n"><i></i>${EX[r.id].name}</span><span class="v"><b>${fmt(b)} kg</b>${dl>0?`<em>+${fmt(dl)}</em>`:""}</span>${spark(r.pts.map(p=>p.y))}</button>`; }).join("")}</div></div>
   <div class="card" id="detail" style="--i:5;--cat:${CAT[E.cat].c}">
     <label class="label" for="progSel">Détail du mouvement</label>
     <select id="progSel">${recs.map(r=>`<option value="${r.id}" ${r.id===progEx?"selected":""}>${EX[r.id].name}</option>`).join("")}</select>
     <div class="stats"><div><b>${fmt(best)} kg</b><span>Charge max</span></div><div><b>${fmt(Math.round(rm*2)/2)} kg</b><span>1RM estimé</span></div><div><b style="color:${delta>0?'var(--good)':'inherit'}">${pts.length>1?(delta>=0?"+":"")+fmt(delta)+" kg":"–"}</b><span>Depuis le début</span></div></div>
     <div class="chart">${bigChart(pts)}</div>
     ${!demo&&TARGET[progEx]?(()=>{ const a=advice(progEx); return `<p class="note"><span class="chip ${a.kind}">${a.short}</span> ${a.text}</p>`; })():""}
     <p class="note">Courbe : charge la plus lourde de chaque séance. Le 1RM estimé (formule d'Epley) donne un ordre de grandeur, pas une charge à tenter.</p>
     <div class="tbl"><table><thead><tr><th>Date</th><th>Séries (kg × reps)</th></tr></thead><tbody>${pts.slice().reverse().slice(0,6).map(p=>`<tr><td>${fmtDate(p.d)}</td><td class="mono">${p.sets.map(y=>fmt(y.kg)+"×"+y.reps).join(" · ")}</td></tr>`).join("")}</tbody></table></div>
   </div>
   <div class="card" style="--i:6"><span class="label">Historique</span><div>${s.slice().reverse().map(x=>{ const n=allSets(x).length;
      return `<div class="hrow"><span class="d" style="--cat:${DAYCOL[x.day]}">${x.day}</span><div class="info">${fmtDate(x.date)}<span>${n} séries${x.minutes?" · "+x.minutes+" min":""} · ${fmt(Math.round(allSets(x).reduce((a,y)=>a+y.kg*y.reps,0)))} kg</span></div>${demo?"":`<button class="btn small" data-del="${x.id}">Supprimer</button>`}</div>`; }).join("")}</div></div>`;
  countUps(vP);
}
vP.addEventListener("change",e=>{ if(e.target.id==="progSel"){ progEx=e.target.value; renderProg(); document.getElementById("detail").scrollIntoView({block:"start"}); } });
vP.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  if(b.id==="demoOn"){ demo=true; enter(vP); renderProg(); return; }
  if(b.id==="demoOff"){ demo=false; enter(vP); renderProg(); return; }
  if(b.dataset.rec){ progEx=b.dataset.rec; renderProg(); document.getElementById("detail").scrollIntoView({behavior:reduced?"auto":"smooth",block:"start"}); return; }
  if(b.dataset.del){
    if(b.dataset.c) removeSession(b.dataset.del).then(()=>toast("Séance supprimée."));
    else { b.dataset.c=1; b.textContent="Confirmer"; b.classList.add("danger"); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.c; b.textContent="Supprimer"; b.classList.remove("danger"); } },3500); }
  }
});
